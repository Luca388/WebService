# 13주차 Docker 실습을 GitHub 러너(리눅스 amd64 / arm64)에서 처음부터 다시 실행하고,
# 결과가 실습 안내의 관찰 기준과 맞는지 검사합니다.
# - 실습 00~05: v1 커밋(8deb683)의 index.html로 진행
# - 실습 06: 현재 커밋의 index.html(v2)로 빌드·비교
# - 실습 07: 실습 자원 정리
# 각 러너의 실행 기록(evidence/*.txt)은 아티팩트로 내려받을 수 있습니다.
name: week13-docker

on:
  push:
    paths:
      - "week13-docker/**"
      - ".github/workflows/week13-docker.yml"
  pull_request:
    paths:
      - "week13-docker/**"
      - ".github/workflows/week13-docker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    name: lab (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: week13-docker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # v1 커밋의 index.html을 꺼내기 위해 전체 이력 필요

      - name: 실습 00~05 (v1)
        run: |
          git show 8deb683:week13-docker/project/index.html > project/index.html
          grep -n "<h1>" project/index.html
          bash evidence/collect.sh 0 1 2 3 4 5

      - name: 실습 06 (v1 → v2)
        run: |
          git checkout -- project/index.html
          grep -n "<h1>" project/index.html
          bash evidence/collect.sh 6

      - name: 실습 07 (정리)
        run: bash evidence/collect.sh 7

      - name: 관찰 기준 검사
        run: bash evidence/verify.sh

      - name: 실행 기록 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.arch }}
          path: week13-docker/evidence/*.txt

  # Windows 러너는 Linux 컨테이너를 실행할 수 없으므로(Windows 컨테이너 전용),
  # Windows에서 clone한 파일(CRLF 줄바꿈)을 그대로 Linux Docker로 넘겨 빌드·실행한다.
  # Windows의 Docker Desktop(Linux 컨테이너)에서 이 저장소를 clone해 실습하는 상황과 같다.
  windows-checkout:
    name: windows clone
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows에서 받은 파일의 줄바꿈 확인
        shell: pwsh
        run: |
          "core.autocrlf = $(git config --get core.autocrlf)"
          foreach ($f in 'Dockerfile', '.dockerignore', 'index.html') {
            $t = [IO.File]::ReadAllText("week13-docker/project/$f")
            "{0,-14} CRLF {1}줄" -f $f, ([regex]::Matches($t, "`r`n").Count)
          }
      - uses: actions/upload-artifact@v4
        with:
          name: project-from-windows
          path: week13-docker/project/
          include-hidden-files: true # .dockerignore 포함

  windows-files-on-linux:
    name: windows files → linux docker
    needs: windows-checkout
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: project-from-windows
          path: project
      - name: 받은 파일의 줄바꿈 확인
        run: |
          for f in Dockerfile .dockerignore index.html; do
            printf '%-14s CRLF %s줄\n' "$f" "$(grep -c $'\r$' "project/$f" || true)"
          done
      - name: 빌드·실행·응답 확인
        working-directory: project
        run: |
          set -o pipefail
          docker build --progress=plain -t wsd13ko:win . 2>&1 | grep -E 'transferring context|COPY|naming to'
          docker run -d --name wsd13ko-win -p 127.0.0.1:18384:80 wsd13ko:win
          for i in $(seq 50); do curl -s -o /dev/null http://127.0.0.1:18384/ && break; sleep 0.2; done
          curl -s -w '\nHTTP %{http_code}\n' http://127.0.0.1:18384/ | grep -E '<h1>|^HTTP'
          curl -s http://127.0.0.1:18384/ | grep -q '<h1>Release v2 is online.</h1>'
          docker rm -f wsd13ko-win >/dev/null && docker image rm wsd13ko:win >/dev/null
